name: Valuation tracker

# Runs the tracker after the US close on weekdays, keeps its history on the
# `data` branch, and publishes the dashboard with GitHub Pages.
on:
  schedule:
    - cron: '30 22 * * 1-5'   # 22:30 UTC = 17:30 New York in winter, 18:30 in summer
    # Catch-up: GitHub drops and delays scheduled runs when it is busy (the
    # first evening's never started). Every scheduled run does nothing when
    # the history already holds the latest close, so this one only works
    # when the evening run did not.
    - cron: '30 3 * * 2-6'
  workflow_dispatch:           # "Run workflow" button on the Actions tab
  push:                        # a code or watchlist change re-runs it
    branches: [main]
    paths:
      - 'valuation/**'
      - 'run_valuation.py'
      - 'valuation_watchlist.txt'
      - 'requirements-valuation.txt'
      - '.github/workflows/valuation.yml'

permissions:
  contents: read

concurrency:
  group: valuation-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120         # the first S&P 500 run downloads ~500 filings
    permissions:
      contents: write          # to push the history store to the data branch
      issues: write            # to post the run's changes, which notifies you
    outputs:
      skipped: ${{ steps.track.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the history store (data branch)
        uses: actions/checkout@v7
        with:
          ref: data
          path: _data

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-valuation.txt

      - name: Install
        run: pip install -r requirements-valuation.txt

      # Filings, prices and splits from earlier runs, so a normal day fetches
      # only what changed. Losing this cache costs one slower run, nothing more:
      # the record itself lives on the data branch.
      - name: Restore downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            data_cache
            valuation_state
          key: valuation-downloads-${{ github.run_id }}
          restore-keys: valuation-downloads-

      # FRED leaves requests from GitHub's servers hanging unless they use its
      # API (set the FRED_API_KEY secret). Until then, a copy kept on the data
      # branch stands in - marked old, so FRED is still tried first, and dated
      # on the dashboard, so its age shows.
      - name: Seed macro series the cache does not have
        run: |
          mkdir -p data_cache/macro
          for f in _data/macro_seed/*.parquet; do
            [ -e "$f" ] || continue
            dest="data_cache/macro/$(basename "$f")"
            if [ ! -e "$dest" ]; then cp "$f" "$dest" && touch -d '2000-01-01' "$dest"; fi
          done
          # Per-class figures read from annual reports (Visa, Berkshire) - kept
          # on the data branch, since SEC's archive refuses runs without a
          # contact in VALUATION_USER_AGENT.
          mkdir -p valuation_state
          if [ -e _data/share_classes.json ] && [ ! -e valuation_state/share_classes.json ]; then
            cp _data/share_classes.json valuation_state/
          fi

      - name: Regression tests
        run: python tests/test_valuation.py

      - name: Run the tracker
        id: track
        env:
          VALUATION_TRACKER: _data/valuation_tracker.xlsx
          VALUATION_USER_AGENT: ${{ secrets.VALUATION_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          VALUATION_ALERTS: _alerts.md
          # Any scheduled run, not one matched by its cron string: the first
          # catch-up ran in full with CATCH_UP false. Pushes and manual runs
          # always run in full.
          CATCH_UP: ${{ github.event_name == 'schedule' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$CATCH_UP" = "true" ]; then
            python run_valuation.py --catch-up
          else
            python run_valuation.py
          fi

      - name: Keep downloads for the next run
        if: always() && steps.track.outputs.skipped != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data_cache
            valuation_state
          key: valuation-downloads-${{ github.run_id }}

      - name: Commit the history store
        if: steps.track.outputs.skipped != 'true'
        working-directory: _data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -e ../valuation_state/share_classes.json ]; then cp ../valuation_state/share_classes.json .; fi
          git add -A valuation_tracker_store
          if [ -d valuation_pending ]; then git add -A valuation_pending; fi
          if [ -e share_classes.json ]; then git add share_classes.json; fi
          if git diff --cached --quiet; then
            echo "History store unchanged."
          else
            git commit -m "Tracker run $(date -u +%Y-%m-%d)"
            git push origin HEAD:data
          fi

      # One rolling issue, labelled tracker-alerts: each run that found a
      # company moving adds a comment, and GitHub notifies you of it.
      - name: Post the run's changes
        if: hashFiles('_alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label tracker-alerts --state open --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            gh label create tracker-alerts --color 1F6FEB --description "Changes the valuation tracker found" || true
            gh issue create --label tracker-alerts --title "Valuation tracker: what changed" \
              --body "Each comment lists the changes one run found. Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            n=$(gh issue list --label tracker-alerts --state open --json number --jq '.[0].number')
          fi
          gh issue comment "$n" --body-file _alerts.md

      - name: Assemble the site
        if: steps.track.outputs.skipped != 'true'
        run: |
          mkdir -p _site
          cp valuation_dashboard.html _site/index.html
          cp _data/valuation_tracker.xlsx _site/
          if [ -d valuation_details ]; then cp -r valuation_details _site/; fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.track.outputs.skipped != 'true'
        with:
          path: _site

  deploy:
    needs: run
    if: needs.run.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
